name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' BLEUnlock/Info.plist)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists - bump CFBundleShortVersionString in BLEUnlock/Info.plist to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (ad-hoc signed)
        if: steps.ver.outputs.publish == 'true'
        run: |
          xcodebuild -project BLEUnlock.xcodeproj -scheme BLEUnlock -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual build

      - name: Package
        if: steps.ver.outputs.publish == 'true'
        run: |
          ditto -c -k --keepParent build/BLEUnlock.app "BLEUnlock-${{ steps.ver.outputs.version }}.zip"
          shasum -a 256 "BLEUnlock-${{ steps.ver.outputs.version }}.zip" > SHA256SUMS.txt

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.ver.outputs.version }}" --target "$GITHUB_SHA" "BLEUnlock-${{ steps.ver.outputs.version }}.zip" SHA256SUMS.txt \
            --title "BLEUnlock LTS ${{ steps.ver.outputs.version }}" --generate-notes
