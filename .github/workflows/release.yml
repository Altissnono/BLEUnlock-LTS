name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' BLEUnlock/Info.plist)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != Info.plist v$v"; exit 1; }

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project BLEUnlock.xcodeproj -scheme BLEUnlock -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual build

      - name: Package
        run: |
          ditto -c -k --keepParent build/BLEUnlock.app "BLEUnlock-${GITHUB_REF_NAME#v}.zip"
          shasum -a 256 "BLEUnlock-${GITHUB_REF_NAME#v}.zip" > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "BLEUnlock-${GITHUB_REF_NAME#v}.zip" SHA256SUMS.txt \
            --title "BLEUnlock LTS ${GITHUB_REF_NAME#v}" --generate-notes
