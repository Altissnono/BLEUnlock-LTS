name: Release

on:
  push:
    tags: ['v*']   # the tag is pushed by the maintainer (scripts/release.sh); the workflow only builds and publishes

permissions:
  contents: write        # create the release
  id-token: write        # sign the provenance attestation (Sigstore)
  attestations: write    # store the attestation

jobs:
  release:
    runs-on: macos-latest
    env:
      HAVE_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Decide version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' BLEUnlock/Info.plist)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Info.plist version v$v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Release v$v already exists - nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.ver.outputs.publish == 'true' && env.HAVE_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW=$(uuidgen)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build (Developer ID signed)
        if: steps.ver.outputs.publish == 'true' && env.HAVE_CERT == 'true'
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project BLEUnlock.xcodeproj -scheme BLEUnlock -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build" CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" OTHER_CODE_SIGN_FLAGS="--timestamp" build
          codesign --verify --deep --strict --verbose=2 build/BLEUnlock.app

      - name: Notarize and staple
        if: steps.ver.outputs.publish == 'true' && env.HAVE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent build/BLEUnlock.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM" --wait
          xcrun stapler staple build/BLEUnlock.app
          spctl --assess --type execute --verbose build/BLEUnlock.app

      - name: Build (ad-hoc signed — no Developer ID secrets configured)
        if: steps.ver.outputs.publish == 'true' && env.HAVE_CERT != 'true'
        run: |
          xcodebuild -project BLEUnlock.xcodeproj -scheme BLEUnlock -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual build

      - name: Package
        if: steps.ver.outputs.publish == 'true'
        run: |
          ditto -c -k --keepParent build/BLEUnlock.app "BLEUnlock-${{ steps.ver.outputs.version }}.zip"
          shasum -a 256 "BLEUnlock-${{ steps.ver.outputs.version }}.zip" > SHA256SUMS.txt

      - name: Attest build provenance
        if: steps.ver.outputs.publish == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: BLEUnlock-${{ steps.ver.outputs.version }}.zip

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if gh release create "v$VERSION" --verify-tag "BLEUnlock-$VERSION.zip" SHA256SUMS.txt \
                 --title "BLEUnlock LTS $VERSION" --generate-notes; then exit 0; fi
            # another run may have published the same version meanwhile: that is fine
            if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release already exists"; exit 0; fi
            sleep $((attempt * 15))
          done
          exit 1
