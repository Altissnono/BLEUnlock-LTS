name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Security regression checks
        run: ./scripts/security-check.sh
      - name: Unit tests
        run: swift test
      - name: Build
        run: |
          xcodebuild clean build -project BLEUnlock.xcodeproj -scheme BLEUnlock \
            -configuration Release CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual
      - name: Verify the signed build (no debugger entitlement, hardened runtime)
        run: ./scripts/verify-build.sh build/BLEUnlock.app
