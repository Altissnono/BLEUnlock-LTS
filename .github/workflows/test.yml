name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security regression checks
        run: ./scripts/security-check.sh
      - name: Build
        run: |
          xcodebuild clean build -project BLEUnlock.xcodeproj -scheme BLEUnlock \
            -configuration Release CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual
